name: Animación de contribuciones

on:
  schedule:
    - cron: "17 6 * * *"   # una vez al día
  workflow_dispatch:        # botón "Run workflow" para generarla a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG en colores de marca
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2563EB&color_dots=#EEF2F7,#DBEAFE,#93C5FD,#3B82F6,#1D4ED8
            dist/snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#161B22,#172554,#1D4ED8,#3B82F6,#93C5FD

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
